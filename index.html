<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>四季通行證試算</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600&display=swap" rel="stylesheet">
<style>
/* VOICE corporate, premium, confident: a travel company's membership product
   IDEA a premium membership card you hold first, then open your year's statement
   PICTURE screen 1: the pass card itself, large; screen 2: a clean statement with a charcoal result panel
   COLOUR white and warm grey, charcoal ink, one corporate red accent; season colours only as thin bars
   TYPE Inter Tight + Noto Sans TC, Noto Serif TC for the card name
   LAYOUT screen 1 centred card with call to action; screen 2 inputs left, sticky result right, breakdown below */
:root{color-scheme:light dark;--bg:light-dark(#f5f4f1,#111315);--paper:light-dark(#ffffff,#1a1d20);--ink:light-dark(#17191c,#eceef0);--soft:light-dark(#62676d,#a3a9af);--line:light-dark(#e3e1dc,#2c3035);--red:light-dark(#c8102e,#ff4d5e);--char:#1d2024;--win:#9cc3dc;--spr:#f2a7bb;--sum:#9b86d4;--aut:#e58a45;--peak:#e8a33d;--reg:#b9cdd8;--off:#6fb3d6;--super:#c8102e}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.55 "Inter Tight","Noto Sans TC",system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{margin:0;line-height:1.15;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:clamp(24px,3vw,32px);font-weight:700}
h3{font-size:15px;font-weight:600;color:var(--soft);margin-bottom:10px}
button,select{font:inherit;font-size:16px;color:var(--ink)}
button{cursor:pointer}
button:focus-visible,select:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px max(4vw,16px);max-width:1200px;margin:0 auto}
.brand{font-weight:700;letter-spacing:.02em}
.brand span{color:var(--red)}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--paper)}
.lang button{border:0;background:transparent;border-radius:999px;padding:6px 14px;min-height:36px;font-size:14px}
.lang button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.view{display:none}.view.on{display:block}
#home{min-height:calc(100% - 72px)}
.hero{max-width:1200px;margin:0 auto;padding:clamp(16px,4vw,48px) max(4vw,16px) 48px;display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:clamp(24px,5vw,64px);align-items:center}
.hero h1{font-size:clamp(34px,4.6vw,54px);font-weight:700}
.hero p{color:var(--soft);font-size:18px;max-width:46ch;margin:16px 0 26px}
.cta{display:inline-flex;align-items:center;gap:10px;background:var(--red);color:#fff;border:0;border-radius:999px;padding:14px 26px;min-height:52px;font-weight:600;font-size:17px}
.cta:hover{filter:brightness(1.08)}
.facts{display:flex;flex-wrap:wrap;gap:22px;margin-top:30px;font-size:14px;color:var(--soft)}
.facts b{display:block;font-size:22px;color:var(--ink)}
.card{position:relative;aspect-ratio:1.586;width:100%;max-width:560px;justify-self:center;border-radius:22px;background:linear-gradient(135deg,#25292e 0%,#15171a 60%,#2b2f35 100%);color:#fff;padding:clamp(18px,3.4vw,30px);box-shadow:0 30px 60px -20px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.06) inset;overflow:hidden;border:0;text-align:left;display:grid;grid-template-rows:auto 1fr auto;transition:transform .4s ease}
.card:hover{transform:translateY(-4px) rotate(-.6deg)}
.card .sheen{position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.10) 45%,transparent 60%);pointer-events:none}
.card .stripe{position:absolute;right:0;top:0;bottom:0;width:22%;background:linear-gradient(180deg,var(--win),var(--spr) 35%,var(--sum) 65%,var(--aut));opacity:.9}
.card .stripe::before{content:"";position:absolute;left:-14px;top:0;bottom:0;width:14px;background:var(--red)}
.c1{display:flex;justify-content:space-between;gap:10px;position:relative;width:74%}
.c1 small{font-size:12px;letter-spacing:.08em;color:#c9ced3}
.chipx{width:46px;height:34px;border-radius:7px;background:linear-gradient(135deg,#d9c27a,#a8893d);position:relative}
.chipx::after{content:"";position:absolute;inset:8px 10px;border:1px solid rgba(0,0,0,.25);border-radius:3px}
.cname{font-family:"Noto Serif TC",serif;font-size:clamp(22px,3.4vw,32px);align-self:center;position:relative;width:74%}
.cname em{display:block;font-family:"Inter Tight",sans-serif;font-style:normal;font-size:clamp(12px,1.6vw,15px);letter-spacing:.14em;color:#c9ced3;margin-top:4px}
.c3{display:grid;grid-template-columns:repeat(3,auto);justify-content:start;gap:clamp(14px,3vw,30px);position:relative;width:76%}
.c3 small{display:block;font-size:11px;letter-spacing:.08em;color:#aeb4ba}
.c3 b{font-size:clamp(14px,1.8vw,17px);font-weight:600;white-space:nowrap}
.num{position:absolute;right:26%;bottom:clamp(18px,3.4vw,30px);font-size:13px;letter-spacing:.12em;color:#aeb4ba;margin-right:18px;display:none}
.cardcol{display:grid;justify-items:center;gap:14px}.tap{font-size:14px;color:var(--soft);margin:0}
.wrap{max-width:1200px;margin:0 auto;padding:8px max(4vw,16px) 56px}
.back{border:0;background:none;color:var(--soft);padding:8px 0;min-height:40px}
.calc{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:clamp(18px,3vw,32px);align-items:start;margin-top:18px}
.box{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:clamp(18px,2.6vw,26px);margin-bottom:16px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:9px 14px;min-height:44px}
.seg button[aria-pressed=true]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.trip{display:grid;grid-template-columns:6px 5em minmax(0,1fr) minmax(0,1fr) minmax(0,1.1fr);gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.trip i{height:100%;min-height:40px;border-radius:3px;background:var(--s)}
.trip b{font-weight:600}
.trip b small{display:block;font-weight:500;font-size:12px;color:var(--soft)}
select{width:100%;min-height:44px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--paper)}
select:disabled{opacity:.45}
.note{font-size:13px;color:var(--soft);margin-top:10px}
.res{position:sticky;top:16px;background:var(--char);color:#fff;border-radius:18px;padding:24px}
.res .l{font-size:14px;color:#b7bdc3}
.big{font-size:clamp(40px,5.4vw,56px);font-weight:700;line-height:1;white-space:nowrap;font-variant-numeric:tabular-nums;margin:6px 0}
.saveB{display:inline-block;background:var(--red);color:#fff;border-radius:6px;padding:4px 10px;font-weight:600;font-size:15px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.12);font-size:15px}
.kv span:last-child{white-space:nowrap;font-variant-numeric:tabular-nums}
.msg{border-left:3px solid #fff;padding:4px 0 4px 10px;margin-top:12px;font-size:14px;color:#dfe3e6}
.msg.w{border-color:var(--red);color:#fff}
.yr{display:flex;height:8px;border-radius:4px;overflow:hidden;margin-top:18px}
.yr div{height:100%}
.pins{position:relative;height:24px;margin-top:5px}
.pin{position:absolute;top:0;transform:translateX(-50%);width:22px;height:22px;border-radius:50%;background:#fff;color:var(--char);font-size:12px;font-weight:700;display:grid;place-items:center}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{border-bottom:1px solid var(--line);padding:10px 8px;text-align:left;vertical-align:top}
th{font-size:13px;color:var(--soft);font-weight:500}
.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
tfoot td{font-weight:700;border-bottom:0}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.cols ul{margin:0;padding-left:20px}.cols li{margin:5px 0}
details summary{cursor:pointer;font-weight:600;min-height:32px}
@media(max-width:900px){.hero,.calc{grid-template-columns:minmax(0,1fr)}.res{position:static}.card{max-width:520px}.hero{padding-bottom:70px}}
@media(max-width:600px){.cols{grid-template-columns:minmax(0,1fr)}.trip{grid-template-columns:6px minmax(0,1fr) minmax(0,1fr)}.trip b{grid-column:2/-1}.trip select{grid-column:auto}.trip .bon{grid-column:2/-1}.trip i{grid-row:span 3}table{font-size:13px}th,td{padding:7px 4px}}
@media(prefers-reduced-motion:no-preference){.view.on{animation:in .45s ease}@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}.card .sheen{animation:sh 5s ease-in-out infinite}@keyframes sh{0%,60%{transform:translateX(-60%)}100%{transform:translateX(60%)}}}
</style>
</head>
<body>
<div class="bar">
<div class="brand">FOUR-SEASON <span>PASS</span></div>
<div class="lang" id="lang" role="group" aria-label="Language"><button data-l="zh">中文</button><button data-l="en">EN</button></div>
</div>

<main id="home" class="view on">
<div class="hero">
<div>
<h1 data-t="hTitle"></h1>

<div class="cname"><span data-t="cName"></span><em>FOUR-SEASON PASS</em></div>
<div class="c3"><div><small data-t="cHolder"></small><b data-t="cHolderV"></b></div><div><small data-t="cTrips"></small><b id="cTripsV"></b></div><div><small data-t="cValid"></small><b>2027.01–12</b></div></div>

</div>
</div>
</main>

<main id="calcV" class="view">
<div class="wrap">

<div>

<div class="box">

<div id="kv"></div>
<div id="msgs"></div>
<div class="yr" id="yr"></div>
<div class="pins" id="pins"></div>
</aside>
</div>

<div class="box scroll" style="margin-top:8px"><h3 data-t="docT"></h3><table><thead id="th"></thead><tbody id="tb"></tbody><tfoot id="tf"></tfoot></table><p class="note" id="extraNote"></p></div>
<div class="cols">
<div class="box"><h3 data-t="perkT"></h3><ul id="perks"></ul></div>
<div class="box"><h3 data-t="ruleT"></h3><div class="scroll"><table><thead id="rth"></thead><tbody id="rtb"></tbody></table></div><p class="note" data-t="ruleNote"></p></div>

</div>
</main>

const cost={toya:{off:9407,peak:16256},furano:{off:12464,peak:21110}};
const nightCost={toya:2650,furano:3321},EXP=833;
const tierOf=[null,'peak','peak','reg','off','reg','reg','peak','peak','reg','reg','off','reg'];
const seasonOf=m=>m===12||m<=2?'win':m<=5?'spr':m<=8?'sum':'aut';
let who='pair',n=2,trips=[{b:'toya',m:11,bonus:'night'},{b:'furano',m:7,bonus:'night'},{b:'toya',m:2,bonus:'night'},{b:'furano',m:9,bonus:'night'}];
const opts=(arr,sel)=>arr.map(([v,l])=>`<option value="${v}"${v==sel?' selected':''}>${l}</option>`).join('');
const show=v=>{$('#home').classList.toggle('on',v==='home');$('#calcV').classList.toggle('on',v==='calc');window.scrollTo(0,0)};
const route=()=>show(location.hash==='#calc'?'calc':'home');
const render=()=>{
  document.documentElement.lang=L==='zh'?'zh-Hant':'en';
  for(const el of document.querySelectorAll('[data-t]')){const v=t(el.dataset.t);if(typeof v==='string')el.textContent=v}
  for(const b of $('#lang').children)b.setAttribute('aria-pressed',b.dataset.l===L);
  $('#facts').innerHTML=t('facts').map(([a,b])=>`<div><b>${a}</b>${b}</div>`).join('');
  $('#cKind').textContent=t('kind')(n);$('#cTripsV').textContent=String(n);
  for(const b of $('#who').children){b.textContent=t(b.dataset.v);b.setAttribute('aria-pressed',b.dataset.v===who)}
  for(const b of $('#ver').children){b.textContent=t('ver')(+b.dataset.n);b.setAttribute('aria-pressed',+b.dataset.n===n)}
  const months=Array.from({length:12},(_,i)=>[i+1,`${t('mon')(i+1)} · ${t(tierOf[i+1])}`]);
  $('#trips').innerHTML=trips.slice(0,n).map((x,i)=>{const tier=tierOf[x.m],off=tier==='off';
    return `<div class="trip" style="--s:var(--${seasonOf(x.m)})"><i></i><b>${t('trip')(i+1)}<small>${t(tier)}</small></b>
    <select data-i="${i}" data-k="b" aria-label="${t('trip')(i+1)}">${opts([['toya',t('toya')],['furano',t('furano')]],x.b)}</select>
    <select data-i="${i}" data-k="m" aria-label="${t('trip')(i+1)}">${opts(months,x.m)}</select>
    <select class="bon" data-i="${i}" data-k="bonus" aria-label="${t('trip')(i+1)}"${off?'':' disabled'}>${off?opts([['night',t('bNight')],['exp',t('bExp')]],x.bonus):`<option>${t('bNone')}</option>`}</select></div>`}).join('');
  const r=trips.slice(0,n).map((x,i)=>{const tier=tierOf[x.m],p=tier==='peak'?'peak':'off',off=tier==='off',bn=off&&x.bonus==='night',be=off&&x.bonus==='exp';
    return{i,x,tier,ad:add[x.b][p],pay:UNIT*DISC+add[x.b][p],self:retail[x.b][p],nights:bn?4:3,bn,be,lionExtra:bn?nightCost[x.b]:be?EXP:0,val:bn?retail[x.b].off/3:be?EXP:0,cost:cost[x.b][p],comp:UNIT+add[x.b][p]}});
  const passT=UNIT*DISC*n,addT=r.reduce((a,x)=>a+x.ad,0),total=passT+addT,self=r.reduce((a,x)=>a+x.self,0),val=r.reduce((a,x)=>a+x.val,0);
  const peaks=r.filter(x=>x.tier==='peak').length,cap=n===4?2:1,offs=r.filter(x=>x.tier==='off').length,compT=r.reduce((a,x)=>a+x.comp,0);
  $('#total').textContent=fmt(total);
  $('#house').textContent=who==='pair'?t('pairH')(fmt(total*2)):who==='comp'?t('compH')(fmt(compT),fmt(total+compT)):t('soloH');
  $('#save').textContent=t('save')(fmt(self-total),((self-total)/self*100).toFixed(1));
  $('#kv').innerHTML=`<div class="kv"><span>${t('kPass')(n)}</span><span>${fmt(passT)}</span></div><div class="kv"><span>${t('kAdd')}</span><span>${fmt(addT)}</span></div><div class="kv"><span>${t('kSelf')}</span><span>${fmt(self)}</span></div>${val?`<div class="kv"><span>${t('kBonus')}</span><span>+${fmt(val)}</span></div>`:''}`;
  let m='';
  if(peaks>cap)m+=`<div class="msg w">${t('wPeak')(peaks,n,cap)}</div>`;
  if(r.some(x=>x.x.b==='furano'&&x.x.m===11))m+=`<div class="msg w">${t('wFur')}</div>`;
  m+=offs?`<div class="msg">${t('iOff')(offs)}</div>`:peaks<=cap?`<div class="msg">${t('iOk')(peaks,cap)}</div>`:'';
  $('#msgs').innerHTML=m;
  const yr=[[3,'super'],[56,'peak'],[20,'reg'],[39,'off'],[7,'peak'],[56,'reg'],[14,'peak'],[7,'super'],[41,'peak'],[61,'reg'],[30,'off'],[26,'reg'],[5,'super']];
  $('#yr').innerHTML=yr.map(([d,c])=>`<div style="flex:${d};background:var(--${c})"></div>`).join('');
  $('#pins').innerHTML=r.map(x=>`<span class="pin" style="left:${((x.x.m-.5)/12*100).toFixed(1)}%">${x.i+1}</span>`).join('');
  $('#th').innerHTML='<tr>'+t('th').map((h,k)=>`<th${k>=3&&k<=7?' class="n"':''}>${h}</th>`).join('')+'</tr>';
  $('#tb').innerHTML=r.map(x=>`<tr><td>${t('trip')(x.i+1)}</td><td>${t(x.x.b)}</td><td><span class="dot" style="background:var(--${x.tier})"></span>${t('mon')(x.x.m)} · ${t(x.tier)}</td><td class="n">${x.nights}</td><td class="n">${fmt(UNIT*DISC)}</td><td class="n">${fmt(x.ad)}</td><td class="n">${fmt(x.pay)}</td><td class="n">${fmt(x.self)}</td><td>${x.bn?t('dNight'):x.be?t('dExp'):'—'}</td></tr>`).join('');
  $('#tf').innerHTML=`<tr><td colspan="4">${t('total')}</td><td class="n">${fmt(passT)}</td><td class="n">${fmt(addT)}</td><td class="n">${fmt(total)}</td><td class="n">${fmt(self)}</td><td>${val?t('worth')(fmt(val)):'—'}</td></tr>`;
  $('#extraNote').textContent=who==='comp'?t('compNote')(fmt(compT)):who==='solo'?t('soloNote'):'';
  $('#perks').innerHTML=t('perks')(offs).map(p=>`<li>${p}</li>`).join('');
  $('#rth').innerHTML='<tr>'+t('rth').map(h=>`<th>${h}</th>`).join('')+'</tr>';
  $('#rtb').innerHTML=t('rows').map(row=>'<tr>'+row.map(c=>`<td>${c}</td>`).join('')+'</tr>').join('');
  const lc=r.reduce((a,x)=>a+x.cost,0),le=r.reduce((a,x)=>a+x.lionExtra,0),gp=total-lc-le;
  $('#lion').innerHTML=`<tr><td>${t('lPay')}</td><td class="n">${fmt(total)}</td></tr><tr><td>${t('lCost')}</td><td class="n">${fmt(-lc)}</td></tr><tr><td>${t('lExtra')}</td><td class="n">${fmt(-le)}</td></tr><tr><td><b>${t('lGp')}</b></td><td class="n"><b>${fmt(gp)} (${(gp/total*100).toFixed(1)}%)</b></td></tr>`;
};
const open=()=>{location.hash='calc';route()};
$('#go').addEventListener('click',open);$('#cardBtn').addEventListener('click',open);
$('#back').addEventListener('click',()=>{history.replaceState(null,'',location.pathname+location.search);route()});
window.addEventListener('hashchange',route);
$('#lang').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;L=b.dataset.l;try{localStorage.setItem('passLang',L)}catch(err){}render()});
$('#who').addEventListener('click',e=>{const b=e.target.closest('button');if(b){who=b.dataset.v;render()}});
$('#ver').addEventListener('click',e=>{const b=e.target.closest('button');if(b){n=+b.dataset.n;render()}});
$('#trips').addEventListener('change',e=>{const s=e.target;if(!s.dataset.k)return;const x=trips[+s.dataset.i];x[s.dataset.k]=s.dataset.k==='m'?+s.value:s.value;render()});
render();route();
}
</script>
</body>
</html>
